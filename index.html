<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas App - Archaeological Sites of Vidarbha</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --accent-color: #ffe66d;
            --dark-color: #2a2a2a;
            --light-color: #f8f9fa;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a63, #b21f1f, #1a2a63);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: var(--light-color);
            overflow-x: hidden;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        header {
            text-align: center;
            padding: 2rem 1rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        header img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        header img:hover {
            transform: scale(1.05);
        }
        header h1 {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
            background: rgba(255,255,255,0.2);
            padding: 0.5rem 1rem;
            border-radius: 10px;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: center;
        }
        .controls input, .controls select, .controls button {
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
        }
        .controls input, .controls select {
            background: rgba(255,255,255,0.9);
            color: var(--dark-color);
            flex: 1;
            min-width: 200px;
        }
        .controls button {
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .controls button:hover {
            background: #ff5252;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.9);
            color: var(--dark-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: var(--secondary-color);
            color: white;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background: #f1f1f1;
        }
        tbody tr:nth-child(even) {
            background: rgba(0,0,0,0.02);
        }
        .tooltip {
            position: relative;
            cursor: help;
        }
        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            white-space: nowrap;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }
        .tooltip:hover::after {
            opacity: 1;
        }
        .loading, .error {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
        }
        .error {
            color: #ff6b6b;
        }
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }
            .controls {
                flex-direction: column;
            }
            .controls input, .controls select, .controls button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="Vidarbha.png" alt="Vidarbha Image">
        <h1>Archaeological Sites of Vidarbha</h1>
    </header>
    <div class="container">
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search sites...">
            <select id="columnSelect">
                <option value="">All Columns</option>
            </select>
            <button id="loadButton">Load Data</button>
        </div>
        <div id="status" class="loading">Click "Load Data" to fetch and display the archaeological sites data.</div>
        <div id="tableContainer"></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loadButton = document.getElementById('loadButton');
            const statusDiv = document.getElementById('status');
            const tableContainer = document.getElementById('tableContainer');
            const searchInput = document.getElementById('searchInput');
            const columnSelect = document.getElementById('columnSelect');
            
            let data = [];
            let columns = [];
            
            // Initialize column select with placeholder
            function updateColumnSelect() {
                columnSelect.innerHTML = '<option value="">All Columns</option>';
                columns.forEach(col => {
                    const option = document.createElement('option');
                    option.value = col;
                    option.textContent = col;
                    columnSelect.appendChild(option);
                });
            }
            
            // Load Excel file
            loadButton.addEventListener('click', async function() {
                statusDiv.textContent = 'Loading data...';
                statusDiv.className = 'loading';
                tableContainer.innerHTML = '';
                
                try {
                    const response = fetch('Archaeological Sites.xlsx');
                    const arrayBuffer = await response.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                    
                    // Assume first sheet
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    
                    // Convert to JSON
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    if (jsonData.length === 0) {
                        throw new Error('No data found in the Excel sheet.');
                    }
                    
                    // First row as headers
                    const headers = jsonData[0];
                    data = jsonData.slice(1).map(row => {
                        const obj = {};
                        headers.forEach((header, index) => {
                            obj[header] = row[index] !== undefined ? row[index] : '';
                        });
                        return obj;
                    });
                    
                    columns = headers;
                    updateColumnSelect();
                    
                    renderTable();
                    statusDiv.textContent = `Loaded ${data.length} records.`;
                    statusDiv.className = '';
                } catch (error) {
                    console.error(error);
                    statusDiv.textContent = 'Error loading data: ' + error.message;
                    statusDiv.className = 'error';
                }
            });
            
            // Search and filter
            function applyFilters() {
                const searchTerm = searchInput.value.toLowerCase().trim();
                const selectedColumn = columnSelect.value;
                
                const filteredData = data.filter(row => {
                    if (selectedColumn) {
                        const cellValue = String(row[selectedColumn] || '').toLowerCase();
                        return cellValue.includes(searchTerm);
                    } else {
                        // Search across all columns
                        return columns.some(col => 
                            String(row[col] || '').toLowerCase().includes(searchTerm)
                        );
                    }
                });
                
                renderTable(filteredData);
            }
            
            searchInput.addEventListener('input', applyFilters);
            columnSelect.addEventListener('change', applyFilters);
            
            // Render table
            function renderTable(dataToRender = data) {
                if (dataToRender.length === 0) {
                    tableContainer.innerHTML = '<p>No matching records found.</p>';
                    return;
                }
                
                const table = document.createElement('table');
                
                // Create header
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');
                columns.forEach(col => {
                    const th = document.createElement('th');
                    th.textContent = col;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);
                
                // Create body
                const tbody = document.createElement('tbody');
                dataToRender.forEach(row => {
                    const tr = document.createElement('tr');
                    columns.forEach(col => {
                        const td = document.createElement('td');
                        // If the value is a URL, make it a link
                        const value = row[col];
                        if (typeof value === 'string' && (value.startsWith('http://') || value.startsWith('https://'))) {
                            const link = document.createElement('a');
                            link.href = value;
                            link.target = '_blank';
                            link.rel = 'noopener';
                            link.textContent = value;
                            td.appendChild(link);
                        } else {
                            td.textContent = value;
                        }
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                
                tableContainer.innerHTML = '';
                tableContainer.appendChild(table);
            }
        });
    </script>
</body>
</html>
