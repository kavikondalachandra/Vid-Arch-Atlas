<!DOCTYPE html>
<html>
<head>
    <title>Archaeological Sites Atlas - Vidarbha Region</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-sA+e2b0G8K7VZlKk7vYj0c8x0Z+6KJtFj5v8G0j4Yj4Y+U="
        crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
        body { margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; }
        #map { position:absolute; top:0; bottom:0; width:100%; }
        #header {
            position:absolute; top:10px; left:50%; transform:translateX(-50%);
            background:rgba(255,255,255,0.9); padding:10px 20px; border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.2); z-index:1000;
            text-align:center; font-size:1.5em; font-weight-bold; color:#2c3e50;
        }
        #legend {
            position:absolute; bottom:20px; left:20px; background:rgba(255,255,255,0.8);
            padding:10px; border-radius:5px; box-shadow:0 0 10px rgba(0,0,0,0.2);
            font-size:0.9em; line-height:1.8; z-index:1000;
        }
        .info { padding:6px 8px; font:14px/16px Arial, Helvetica, sans-serif; 
                background:white; background:rgba(255,255,255,0.9); 
                box-shadow:0 0 15px rgba(0,0,0,0.2); border-radius:5px; }
        .info h4 { margin:0 0 5px; color:#2c3e50; }
        .site-type { font-weight:bold; text-transform:capitalize; }
    </style>
</head>
<body>
<div id="header">Archaeological Sites of Vidarbha Region</div>
<div id="map"></div>
<div id="legend"></div>

<script id="sitesData" type="application/json">

</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-o9N1j8zZ7w0Qfz+0Kk0V0v0V0v0V0v0V0v0V0v0V0v0="
        crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Parse embedded JSON data
        const sitesData = JSON.parse(document.getElementById('sitesData').textContent);
        
        // Initialize map
        const map = L.map('map').setView([20.5, 78.5], 6); // approximate center of Vidarbha
        
        // Find coordinate columns (case-insensitive)
        const first = sitesData[0];
        const keys = Object.keys(first);
        const getIndex = (name) => keys.find(k => k.trim().toLowerCase() === name.toLowerCase());
        const latKey = getIndex('Latitude') || getIndex('Y') || getIndex('Lat');
        const lonKey = getIndex('Longitude') || getIndex('X') || getIndex('Lng');
        const typeKey = getIndex('Type');
        const investigatorKey = getIndex('Investigator');
        const dateKey = getIndex('Date/Year') || getIndex('Date / Year');
        const ref1Key = getIndex('Reference') || getIndex('Reference1');
        const ref2Key = getIndex('Reference2') || getIndex('References2');
        
        if (!latKey || !lonKey) {
            alert('Latitude/Longitude columns not found. Available columns: ' + keys.join(', '));
            return;
        }
        
        // Parse rows
        const sites = [];
        const typeSet = new Set();
        let minLat = Infinity, maxLat = -Infinity;
        let minLon = Infinity, maxLon = -Infinity;
        
        sitesData.forEach(item => {
            const lat = parseFloat(item[latKey]);
            const lon = parseFloat(item[lonKey]);
            if (isNaN(lat) || isNaN(lon)) return;
            
            const type = (item[typeKey] || '').toString().trim() || 'Unknown';
            typeSet.add(type);
            
            const site = {
                lat: lat,
                lon: lon,
                type: type,
                investigator: (item[investigatorKey] || '').toString().trim(),
                date: (item[dateKey] || '').toString().trim(),
                reference: (item[ref1Key] || '').toString().trim(),
                reference2: (item[ref2Key] || '').toString().trim()
            };
            sites.push(site);
            
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
            if (lon < minLon) minLon = lon;
            if (lon > maxLon) maxLon = lon;
        });
        
        // Create marker cluster group
        const markers = L.markerClusterGroup();
        
        // Assign colors to types (simple palette)
        const typeList = Array.from(typeSet);
        const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#d35400', '#c0392b'];
        const typeColor = {};
        typeList.forEach((t, i) => {
            typeColor[t] = colors[i % colors.length];
        });
        
        // Create markers
        sites.forEach(site => {
            const marker = L.marker([site.lat, site.lon], {
                icon: L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background-color:${typeColor[site.type]};width:12px;height:12px;border-radius:50%;border:2px solid white;"></div>`,
                    iconSize: [12, 12]
                })
            });
            
            const popupContent = `
                <div class="info">
                    <h4>${site.type}</h4>
                    <b>Investigator:</b> ${site.investigator || 'N/A'}<br>
                    <b>Date/Year:</b> ${site.date || 'N/A'}<br>
                    <b>Reference:</b> ${site.reference || 'N/A'}<br>
                    <b>Reference 2:</b> ${site.reference2 || 'N/A'}
                </div>
            `;
            marker.bindPopup(popupContent);
            markers.addLayer(marker);
        });
        
        // Add markers to map
        map.addLayer(markers);
        
        // Add image overlay
        const imageBounds = [[minLat, minLon], [maxLat, maxLon]];
        const imageOverlay = L.imageOverlay('Vidarbha.png', imageBounds, {opacity: 0.6}).addTo(map);
        
        // Fit map to markers and image
        const group = new L.featureGroup([markers, imageOverlay]);
        map.fitBounds(group.getBounds().pad(0.1));
        
        // Create legend
        const legend = L.control({position: 'bottomleft'});
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'info legend');
            let innerHTML = '<b>Site Types</b><br>';
            typeList.forEach(type => {
                innerHTML += `<i style="background:${typeColor[type]};width:12px;height:12px;display:inline-block;border-radius:50%;margin-right:5px;border:1px solid #ccc;"></i> ${type}<br>`;
            });
            div.innerHTML = innerHTML;
            return div;
        };
        legend.addTo(map);
        
        // Add scale bar
        L.control.scale({position: 'bottomright'}).addTo(map);
    });
</script>
</body>
</html>
